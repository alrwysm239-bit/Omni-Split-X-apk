name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer, found: $JAVA_VERSION"
            exit 1
          fi

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK not found at $APK_PATH"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          else
            echo "Success: Debug APK found at $APK_PATH"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
